# Android
android.useAndroidX=true

# Gradle
org.gradle.jvmargs=-Xmx4096M
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

# Kotlin
kotlin.code.style=official
# Each host only builds the native targets it can link (mingwX64 on Windows,
# macosArm64 on macOS, linux* on Linux); skip the rest quietly.
kotlin.native.ignoreDisabledTargets=true
kotlin.native.enableKlibsCrossCompilation=false

# Versions live in gradle/libs.versions.toml. To substitute a different port
# klib version than the bridge plugin's own: -PcomposeDesktopNative.version=...

# Compose: the CMP Gradle plugin refuses a macosArm64 target without this flag,
# even though the native targets here render through compose-desktop-native.
org.jetbrains.compose.experimental.macos.enabled=true
